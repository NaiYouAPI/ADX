<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADX工作室 | ADX Studio</title>
    <!-- 引入科技感字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400&display=swap"
          rel="stylesheet">
    <style>
        /* --- 核心样式 --- */
        :root {
            --primary: #00f3ff; /* 霓虹青 */
            --secondary: #0051ff; /* 科技蓝 */
            --dark: #050505;
            --glass: rgba(10, 15, 20, 0.75);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--dark);
            color: white;
            font-family: 'Roboto', sans-serif;
            overflow-x: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* --- 动态背景 Canvas --- */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            /* 这里可以叠加一层淡淡的网格纹理，增强科技感 */
            background-image: linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* --- 语言选择遮罩 --- */
        #lang-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
            transition: opacity 0.5s ease;
        }

        .lang-btn {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 15px 40px;
            margin: 10px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }

        .lang-btn:hover {
            background: var(--primary);
            color: black;
            box-shadow: 0 0 20px var(--primary);
        }

        /* --- 主容器 --- */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            padding-top: 100px; /* 留出顶部空间 */
            display: none; /* 初始隐藏，选语言后显示 */
            animation: fadeIn 1s ease forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* --- 头部 --- */
        header {
            text-align: center;
            margin-bottom: 60px;
            position: relative;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            color: white;
            text-shadow: 0 0 10px var(--primary), 0 0 20px var(--primary);
            letter-spacing: 5px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--primary);
            font-size: 1.2rem;
            letter-spacing: 2px;
            border-bottom: 1px solid var(--secondary);
            display: inline-block;
            padding-bottom: 5px;
        }

        /* --- 导航 --- */
        nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 10px 25px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            transition: 0.3s;
            backdrop-filter: blur(2px);
        }

        .nav-btn:hover, .nav-btn.active {
            background: var(--secondary);
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--secondary);
        }

        /* --- 内容卡片 --- */
        .section {
            display: none;
            background: var(--glass);
            border: 1px solid rgba(0, 243, 255, 0.2);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            animation: slideUp 0.5s ease;
        }

        .section.active {
            display: block;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            font-family: 'Orbitron', sans-serif;
            color: var(--primary);
            border-left: 4px solid var(--primary);
            padding-left: 15px;
            margin-bottom: 20px;
            text-shadow: 0 0 5px rgba(0, 243, 255, 0.5);
        }

        /* --- 列表样式 --- */
        .item-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .item-card {
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        .item-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.15);
        }

        .item-card h3 {
            color: white;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .item-card p {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 15px;
        }

        .download-link {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: bold;
            display: inline-block;
            margin-top: 10px;
        }

        .download-link:hover {
            text-shadow: 0 0 5px var(--primary);
        }

        /* --- 日本封锁页面 --- */
        #jp-block {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 2000;
            color: red;
            font-family: 'Orbitron', sans-serif;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
        }

        #jp-block h1 {
            font-size: 4rem;
            text-shadow: 2px 2px 0 #fff;
        }
    </style>
</head>
<body>

<!-- 动态背景 Canvas -->
<canvas id="canvas-container"></canvas>

<!-- 日本地区封锁页面 -->
<div id="jp-block">
    <h1>ACCESS DENIED</h1>
    <p>Service not available in your region.</p>
    <p>日本からのアクセスは禁止されています。</p>
</div>

<!-- 语言选择遮罩 -->
<div id="lang-overlay">
    <h1 style="font-size: 2rem; margin-bottom: 30px; color:white;">SELECT LANGUAGE / 选择语言</h1>
    <button class="lang-btn" onclick="setLanguage('zh')">中文</button>
    <button class="lang-btn" onclick="setLanguage('en')">English</button>
    <button class="lang-btn" onclick="setLanguage('ru')">Русский</button>
</div>

<!-- 主内容区 -->
<div class="container" id="main-content">
    <header>
        <h1>ADX Studio</h1>
        <div class="subtitle" id="studio-subtitle">ADX STUDIO</div>
    </header>

    <nav>
        <button class="nav-btn active" onclick="switchTab('home')" id="nav-home">主页</button>
        <button class="nav-btn" onclick="switchTab('products')" id="nav-products">产品下载</button>
        <button class="nav-btn" onclick="switchTab('team')" id="nav-team">人员名单</button>
        <button class="nav-btn" onclick="switchTab('thanks')" id="nav-thanks">鸣谢</button>
    </nav>

    <!-- 主页 -->
    <div id="home" class="section active">
        <h2 id="title-home">ADX</h2>
        <p id="desc-home" style="line-height: 1.8; font-size: 1.1rem; color: #ddd;">
            我们致力于探索数字世界的无限可能。ADX工作室专注于独立游戏开发、软件解决方案以及交互式数字体验。正如您所见，我们的设计灵感来源于多维度的数字空间。
        </p>
    </div>

    <!-- 产品下载 -->
    <div id="products" class="section">
        <h2 id="title-products">产品下载</h2>
        <div class="item-list" id="product-list">
            <!-- JS 渲染 -->
        </div>
    </div>

    <!-- 人员名单 -->
    <div id="team" class="section">
        <h2 id="title-team">核心成员</h2>
        <div class="item-list" id="team-list">
            <!-- JS 渲染 --><!-- 标题标题 -->
        </div>
    </div>

    <!-- 鸣谢 -->
    <div id="thanks" class="section">
        <h2 id="title-thanks">特别鸣谢</h2>
        <div class="item-list" id="thanks-list">
            <!-- JS 渲染 -->
        </div>
    </div>
</div>

<script>
    // --- 数据配置区 (您可以随时在这里添加内容) ---
    const data = {
        zh: {
            nav: {home: "主页", products: "产品下载", team: "人员名单", thanks: "鸣谢"},
            home: {
                title: "欢迎来到ADX",
                desc: "我们致力于探索数字世界的无限可能。ADX工作室专注于独立游戏开发、软件解决方案以及交互式数字体验。正如您所见，我们的设计灵感来源于多维度的数字空间。"
            },
            products: {title: "产品下载"},
            team: {title: "核心成员"},
            thanks: {title: "特别鸣谢"}
        },
        en: {
            nav: {home: "Home", products: "Downloads", team: "Team", thanks: "Credits"},
            home: {
                title: "Welcome to Chuangzhi Cube",
                desc: "We are dedicated to exploring the infinite possibilities of the digital world. Chuangzhi Cube Studio focuses on cutting-edge technology, software solutions, and interactive digital experiences."
            },
            products: {title: "Product Downloads"},
            team: {title: "Core Team"},
            thanks: {title: "Special Thanks"}
        },
        ru: {
            nav: {home: "Главная", products: "Скачать", team: "Команда", thanks: "Благодарности"},
            home: {
                title: "Добро пожаловать",
                desc: "Мы стремимся исследовать безграничные возможности цифрового мира. Студия Chuangzhi Cube специализируется на передовых технологиях и программных решениях."
            },
            products: {title: "Продукты"},
            team: {title: "Наша Команда"},
            thanks: {title: "Особая благодарность"}
        }
    };

    // 产品数据
    const products = [
        {
            name: "迷你计算器",
            ver: "一个小的计算器应用，支持四则运算，需要PY环境，BY:ADX0627",
            link: "https://developer4.lanrar.com/file/?UjRXaVloADEGDwc/BzJdMVRrUmpS5VT4BaNVtAf1B5FStwHPD/oDeQQoAD9RdV16BDhXOwIxBmEDW1U6ATkHO1JhVzJZMABtBmUHYAdrXWlUN1JxUmtUJQU/VWEHbgc1UmABcA8iAycEbwBkUTVdbgRoV30CbAY0AytVYgFlBylSN1dkWTYAMgY2BzQHMl1lVDxSM1JpVDAFZlU3B28HZVIzATUPZgNkBGIAZVExXTkEPVdkAmwGNQNlVTYBOQdkUnxXelltACQGdgckByBdOVR8Uj5SaVRrBTdVYgdqBzRSYQFhD2cDcQQmAD9RaF05BDhXbwJsBjMDPVVhAW4HN1JgVzVZNQBkBn4Hfwd1XTpUYlIgUjBUZgUkVSYHKwdxUm8BZw9lA24EYABlUTRdbARmV2sCbwYiA3FVOgEtBztSYVc2WSoAZgZkB38Hal1pVCBSZlI9VG8FLFV1Bz8HaVIlATgPDQM0BDkAa1E1XXIEeFcmAiQGdANhVQwBKAdnUm9XMA=="
        }
    ];

    // 人员数据
    const team = [
        //{ name: "张工", role: "主程 / Lead Dev" },
    ];

    // 鸣谢数据
    const thanks = [
        //{ name: "开源社区", role: "技术支持" },
        {name: "github.com", role: "发布平台 / GitHub.com"},
    ];

    // --- 逻辑控制 ---

    // 1. 地区检测 (模拟)
    // 注意：真实环境中需要后端或付费API精准判断，这里使用免费API演示
    async function checkRegion() {
        try {
            const response = await fetch('https://ipapi.co/json/');
            const jsonData = await response.json();
            if (jsonData.country_code === 'JP') {
                document.getElementById('jp-block').style.display = 'flex';
                document.getElementById('lang-overlay').style.display = 'none'; // 隐藏语言选择
            }
        } catch (error) {
            console.log("无法检测地区，默认放行");
        }
    }

    // 2. 语言切换
    function setLanguage(lang) {
        document.getElementById('lang-overlay').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('lang-overlay').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
        }, 500);

        // 更新文本
        document.getElementById('nav-home').innerText = data[lang].nav.home;
        document.getElementById('nav-products').innerText = data[lang].nav.products;
        document.getElementById('nav-team').innerText = data[lang].nav.team;
        document.getElementById('nav-thanks').innerText = data[lang].nav.thanks;

        document.getElementById('title-home').innerText = data[lang].home.title;
        document.getElementById('desc-home').innerText = data[lang].home.desc;

        document.getElementById('title-products').innerText = data[lang].products.title;
        document.getElementById('title-team').innerText = data[lang].team.title;
        document.getElementById('title-thanks').innerText = data[lang].thanks.title;

        renderLists(lang);
    }

    // 3. 渲染列表
    function renderLists(lang) {
        const pList = document.getElementById('product-list');
        const tList = document.getElementById('team-list');
        const thList = document.getElementById('thanks-list');

        pList.innerHTML = products.map(p => `
                <div class="item-card">
                    <h3>${p.name}</h3>
                    <p>${p.ver}</p>
                    <a href="${p.link}" class="download-link">${lang === 'zh' ? '下载文件' : (lang === 'en' ? 'Download' : 'Скачать')}</a>
                </div>
            `).join('');

        tList.innerHTML = team.map(t => `
                <div class="item-card">
                    <h3>${t.name}</h3>
                    <p style="color:var(--primary)">${t.role}</p>
                </div>
            `).join('');

        thList.innerHTML = thanks.map(t => `
                <div class="item-card">
                    <h3>${t.name}</h3>
                    <p>${t.role}</p>
                </div>
            `).join('');
    }

    // 4. 切换标签页
    function switchTab(id) {
        document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

        document.getElementById(id).classList.add('active');
        // 找到对应的按钮并高亮（简单逻辑）
        const btns = document.querySelectorAll('.nav-btn');
        if (id === 'home') btns[0].classList.add('active');
        if (id === 'products') btns[1].classList.add('active');
        if (id === 'team') btns[2].classList.add('active');
        if (id === 'thanks') btns[3].classList.add('active');
    }

    // --- 动态背景特效 (核心修改) ---
    const canvas = document.getElementById('canvas-container');
    const ctx = canvas.getContext('2d');
    let width, height;
    let particles = [];

    // 鼠标位置
    let mouse = {x: 0, y: 0};

    window.addEventListener('resize', resize);
    window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX - width / 2;
        mouse.y = e.clientY - height / 2;
    });

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }

    class Particle {
        constructor() {
            this.reset();
        }

        reset() {
            // 随机分布在3D空间中
            this.x = (Math.random() - 0.5) * width * 2;
            this.y = (Math.random() - 0.5) * height * 2;
            this.z = Math.random() * 1000; // 深度
            this.pz = this.z; // 上一帧深度
        }

        update() {
            this.pz = this.z;
            this.z -= 2; // 向屏幕移动的速度
            if (this.z < 1) {
                this.reset();
                this.z = 1000;
                this.pz = this.z;
            }
        }

        draw() {
            // 3D 投影公式
            let sx = (this.x * 500) / (this.z + 500) + width / 2;
            let sy = (this.y * 500) / (this.z + 500) + height / 2;

            // 计算大小
            let r = (1 - this.z / 1000) * 3;

            // 鼠标视差影响 (简单的旋转模拟)
            // 当鼠标移动时，稍微旋转 X 和 Y 轴
            let rotX = (mouse.y / height) * 100;
            let rotY = (mouse.x / width) * 100;

            // 应用旋转 (简化的 3D 旋转逻辑)
            let y_temp = this.y - rotX;
            let x_temp = this.x - rotY;

            sx = (x_temp * 500) / (this.z + 500) + width / 2;
            sy = (y_temp * 500) / (this.z + 500) + height / 2;

            // 绘制点
            ctx.fillStyle = "#00f3ff";
            ctx.globalAlpha = (1 - this.z / 1000);
            ctx.beginPath();
            ctx.arc(sx, sy, r, 0, Math.PI * 2);
            ctx.fill();

            // 绘制连线
            ctx.globalAlpha = (1 - this.z / 1000) * 0.5;
            ctx.strokeStyle = "#0051ff";
            ctx.lineWidth = 0.5;

            // 简单的连线逻辑：如果两个点足够近（在2D投影上）
            // 为了性能，这里只简单连接最近的几个点或随机连接
            // 这里我们做一个简单的网格连接效果模拟
        }
    }

    function initParticles() {
        particles = [];
        for (let i = 0; i < 150; i++) { // 粒子数量
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.fillStyle = "rgba(2, 2, 2, 0.4)"; // 拖尾效果
        ctx.fillRect(0, 0, width, height);

        for (let p of particles) {
            p.update();
            p.draw();
        }
        for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
                let p1 = particles[i];
                let p2 = particles[j];

                // 简单的距离判断
                let dx = p1.x - p2.x;
                let dy = p1.y - p2.y;
                let dz = p1.z - p2.z;
                let dist = Math.sqrt(dx * dx + dy * dy + dz * dz);

                if (dist < 100) {
                    // 投影 p1
                    let sx1 = (p1.x * 500) / (p1.z + 500) + width / 2;
                    let sy1 = (p1.y * 500) / (p1.z + 500) + height / 2;
                    // 投影 p2
                    let sx2 = (p2.x * 500) / (p2.z + 500) + width / 2;
                    let sy2 = (p2.y * 500) / (p2.z + 500) + height / 2;

                    ctx.beginPath();
                    ctx.moveTo(sx1, sy1);
                    ctx.lineTo(sx2, sy2);
                    ctx.globalAlpha = (1 - p1.z / 1000) * (1 - dist / 100);
                    ctx.strokeStyle = "#00f3ff";
                    ctx.stroke();
                }
            }
        }

        requestAnimationFrame(animate);
    }

    resize();
    initParticles();
    animate();
    checkRegion();

</script>
</body>
</html>
